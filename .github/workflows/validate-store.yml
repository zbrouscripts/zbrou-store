name: Validate ZBrou Store

on:
  push:
    branches:
      - design/phrasekill-showcase
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build for Cloudflare Pages
        run: npm run build
        env:
          NITRO_PRESET: cloudflare_pages
          NUXT_PUBLIC_API_PUBLIC_KEY: ""
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser smoke tests
        run: node scripts/visual-smoke.mjs
      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zbrou-store-visual-preview
          path: screenshots/
          if-no-files-found: ignore
