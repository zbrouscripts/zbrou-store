name: Validate ZBrou Store

on:
  push:
    branches:
      - design/phrasekill-showcase
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build for Cloudflare Pages
        run: npm run build
        env:
          NITRO_PRESET: cloudflare_pages
          NUXT_PUBLIC_API_PUBLIC_KEY: ""
